[project]
name = "watch2learn-api"
version = "0.1.0"
description = "Local-first Mandarin vocabulary extraction from timed subtitles"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "jieba>=0.42.1",
  "python-multipart>=0.0.20",
  "pypinyin>=0.55.0",
  "uvicorn>=0.38.0",
]

[dependency-groups]
asr = [
  "av==18.1.0",
  "ctranslate2>=4.6.0",
  "faster-whisper>=1.2.1",
  "sentencepiece>=0.2.0",
]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2",
  "ruff>=0.14.3",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
